name: Mutation testing policy

on:
  issues:
    types: [labeled]
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

jobs:
  notify:
    if: >-
      github.event_name == 'issues' &&
      (github.event.label.name == 'complexity:high' ||
       github.event.label.name == 'priority:high')
    permissions:
      contents: read
      issues: write
    runs-on: arc-runner-vectordb-benchmark
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Explain mandatory mutation testing
        env:
          POLICY_PROVIDER: github
          POLICY_API_URL: ${{ github.api_url }}
          POLICY_REPOSITORY: ${{ github.repository }}
          POLICY_TOKEN: ${{ github.token }}
          POLICY_EVENT_PATH: ${{ github.event_path }}
        run: python3 .github/scripts/mutation_policy.py notify

  mutation-gate:
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    # This job executes PR-controlled .ci/mutation.sh on the repository's
    # dedicated ARC runner. Credentials are scrubbed and Python mutations use
    # a dedicated virtual environment before the script is invoked.
    runs-on: arc-runner-vectordb-benchmark
    steps:
      - name: Checkout trusted policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Classify pull request
        id: policy
        env:
          POLICY_PROVIDER: github
          POLICY_API_URL: ${{ github.api_url }}
          POLICY_REPOSITORY: ${{ github.repository }}
          POLICY_TOKEN: ${{ github.token }}
          POLICY_EVENT_PATH: ${{ github.event_path }}
        run: python3 .github/scripts/mutation_policy.py classify

      - name: Checkout pull request code
        if: steps.policy.outputs.required == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv for Python mutation engines
        if: steps.policy.outputs.required == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Run mandatory mutation testing
        if: steps.policy.outputs.required == 'true'
        shell: bash
        env:
          MUTATION_POLICY_LABELS: ${{ steps.policy.outputs.labels }}
          MUTATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MUTATION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ ! -f .ci/mutation.sh ]]; then
            echo "::error::.ci/mutation.sh is required for high-risk issues (${MUTATION_POLICY_LABELS})."
            exit 1
          fi
          if ! grep -Eiq 'mutmut[[:space:]]+run|gremlins[[:space:]]+unleash|stryker([^[:alnum:]]+[^[:space:]]+)*[[:space:]]+run|cargo[[:space:]]+mutants|pitest|infection' .ci/mutation.sh; then
            echo "::error::.ci/mutation.sh must invoke a supported real mutation engine."
            exit 1
          fi
          # The mutation script comes from the PR. Give it no forge credentials
          # or inherited secrets; only the minimum process environment it needs.
          env -i \
            PATH="$PATH" \
            HOME="$HOME" \
            UV_CACHE_DIR="${UV_CACHE_DIR:-}" \
            UV_LINK_MODE="${UV_LINK_MODE:-copy}" \
            CI=true \
            MUTATION_POLICY_LABELS="$MUTATION_POLICY_LABELS" \
            MUTATION_BASE_SHA="$MUTATION_BASE_SHA" \
            MUTATION_HEAD_SHA="$MUTATION_HEAD_SHA" \
            bash .ci/mutation.sh

      - name: Mutation testing not required
        if: steps.policy.outputs.required != 'true'
        run: echo "No complexity:high or priority:high label found on the PR or linked issue."
